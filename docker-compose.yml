version: "3.9"

services:

  mysql:
    image: mysql:8.4
    container_name: mealmate-mysql

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD locally}
      MYSQL_USER: ${SPRING_DATASOURCE_USERNAME:-mealmate}
      MYSQL_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?Set SPRING_DATASOURCE_PASSWORD locally}
      MYSQL_DATABASE: mealmate

    ports:
      - "3306:3306"

    volumes:
      - mysql-data:/var/lib/mysql

  backend:
    build:
      context: ${MEALMATE_BACKEND_CONTEXT:-.}

    container_name: mealmate-backend

    depends_on:
      - mysql

    ports:
      - "8001:8001"

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/mealmate?createDatabaseIfNotExist=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-mealmate}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?Set SPRING_DATASOURCE_PASSWORD locally}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}

      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET locally}

    restart: unless-stopped

  frontend:
    build:
      context: ${MEALMATE_FRONTEND_CONTEXT:-../mealmate-ui}

    container_name: mealmate-frontend

    depends_on:
      - backend

    ports:
      - "3000:3000"

    stdin_open: true
    tty: true

volumes:
  mysql-data:
